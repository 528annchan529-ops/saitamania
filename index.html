<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAITAMANIA - Audio Guide</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 游明朝などの明朝体に近い美しいセリフ体ベース -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      /* 背景：ストーン・グレー / テキスト：チャコールグレー / フォント：明朝体ベース */
      background-color: #F3F4F6;
      color: #374151;
      font-family: 'Noto Serif JP', 'Yu Mincho', 'YuMincho', serif;
    }
    
    /* 非常にゆっくりとしたクロスフェード・アニメーション */
    .fade-in {
      animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 選択肢ホバー/アクティブ時のうっすらとしたハイライト */
    .option-item {
      transition: background-color 0.4s ease, opacity 0.4s ease;
    }
    .option-item:active {
      background-color: rgba(55, 65, 81, 0.05); /* チャコールグレーの極薄い透過 */
    }

    /* 解説エリアの展示プレート風ディバイダー */
    .museum-divider {
      border-top: 1px solid rgba(55, 65, 81, 0.2);
      margin: 2rem 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 sm:p-12">

  <!-- メインキャンバス（余白をたっぷりとる） -->
  <main class="w-full max-w-lg mx-auto flex flex-col justify-center min-h-[80vh]">
    
    <!-- ローディング表示 -->
    <div id="loadingArea" class="text-center fade-in">
      <p class="text-sm tracking-widest uppercase opacity-60">Connecting to Audio Guide...</p>
    </div>

    <!-- クイズエリア（初期は非表示） -->
    <div id="quizContainer" class="hidden w-full">
      
      <!-- オーディオガイド風ヘッダー（メタデータ） -->
      <header class="mb-12 flex justify-between items-baseline border-b border-gray-300 pb-2">
        <div class="text-xs tracking-widest uppercase opacity-70">
          Track <span id="trackNumber">01</span>: <span id="trackTitle">Loading</span>
        </div>
        <div class="text-[10px] tracking-widest opacity-50 uppercase">
          <span id="cityLabel">City</span> / <span id="difficultyLabel">Level</span>
        </div>
      </header>

      <!-- 問題文（作品キャプション風） -->
      <div class="mb-12 fade-in">
        <h1 id="questionText" class="text-xl sm:text-2xl leading-loose tracking-wide font-light">
          <!-- 問題文がここに入ります -->
        </h1>
      </div>

      <!-- 選択肢（枠線なし、余白を持たせたリスト） -->
      <div id="optionsContainer" class="space-y-6 fade-in">
        <!-- JSで動的にリストが挿入されます -->
      </div>

      <!-- 解説エリア（展示プレート風、初期は非表示） -->
      <div id="explanationArea" class="hidden fade-in mt-12">
        <!-- 判定結果を静かに表示 -->
        <div id="resultText" class="text-sm tracking-widest uppercase font-semibold mb-8"></div>

        <!-- ディバイダー -->
        <div class="museum-divider"></div>

        <!-- 解説本文 -->
        <div class="space-y-8">
          <div>
            <h2 class="text-xs tracking-widest uppercase opacity-60 mb-3">Interpretation</h2>
            <p id="explanationText" class="text-sm leading-loose tracking-wide"></p>
          </div>
          
          <div>
            <h2 class="text-xs tracking-widest uppercase opacity-60 mb-3">Conversation Piece</h2>
            <p id="mountPhrase" class="text-sm leading-loose tracking-wide italic"></p>
          </div>

          <div>
            <h2 class="text-xs tracking-widest uppercase opacity-60 mb-3">Access to the Exhibit</h2>
            <p id="spotName" class="text-sm tracking-wide"></p>
          </div>
        </div>
      </div>
      
    </div>

    <!-- 画面下部のアクションエリア -->
    <div class="mt-16 text-center">
      <button id="nextBtn" class="hidden fade-in text-xs tracking-widest uppercase opacity-60 hover:opacity-100 transition-opacity p-4">
        Next Track 
        <span class="ml-2">→</span>
      </button>
    </div>

  </main>

  <script>
    // ==============================================================
    // ★ GASのウェブアプリURLをここに貼り付けます
    // ==============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzgKf5P9EZi9DACFiL9JWqXpFiBE6qDSgA2ATScYz5pALpMIvDYrknPuieU4FMn-0k/exec";

    let QUIZ_DATABASE = [];
    let currentIndex = 0;
    let isAnswered = false;

    // DOM Elements
    const loadingArea = document.getElementById('loadingArea');
    const quizContainer = document.getElementById('quizContainer');
    
    const trackNumber = document.getElementById('trackNumber');
    const trackTitle = document.getElementById('trackTitle');
    const cityLabel = document.getElementById('cityLabel');
    const difficultyLabel = document.getElementById('difficultyLabel');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    
    const explanationArea = document.getElementById('explanationArea');
    const resultText = document.getElementById('resultText');
    const explanationBody = document.getElementById('explanationText');
    const mountPhrase = document.getElementById('mountPhrase');
    const spotName = document.getElementById('spotName');
    
    const nextBtn = document.getElementById('nextBtn');

    // 初期化（APIからデータ取得）
    async function initQuiz() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data && data.length > 0) {
          QUIZ_DATABASE = shuffleArray(data);
          loadingArea.classList.add('hidden');
          quizContainer.classList.remove('hidden');
          
          // CSSアニメーションをトリガーするために少し遅延させる
          setTimeout(() => {
            loadQuestion(0);
          }, 100);
        } else {
          loadingArea.innerHTML = '<p class="text-sm tracking-widest opacity-60">No exhibits found.</p>';
        }
      } catch (error) {
        console.error(error);
        loadingArea.innerHTML = '<p class="text-sm tracking-widest opacity-60">Connection failed.</p>';
      }
    }

    // トラック（問題）の読み込み
    function loadQuestion(index) {
      isAnswered = false;
      explanationArea.classList.add('hidden');
      nextBtn.classList.add('hidden');

      const data = QUIZ_DATABASE[index];
      
      // メタデータの設定
      trackNumber.textContent = String(index + 1).padStart(2, '0');
      trackTitle.textContent = data.subTheme || "Saitama Exhibition";
      cityLabel.textContent = data.city || "Saitama";
      
      // 難易度を英語のメタファに変換
      let diffLabel = "Level 1";
      if(data.difficulty === "中級") diffLabel = "Level 2";
      if(data.difficulty === "上級") diffLabel = "Level 3";
      if(data.difficulty === "埼玉神") diffLabel = "Masterpiece";
      difficultyLabel.textContent = diffLabel;

      // 問題文
      questionText.textContent = data.question;

      // 選択肢のシャッフル
      const rawOptions = [
        { text: data.correctAnswer, isCorrect: true },
        { text: data.dummyOption1, isCorrect: false },
        { text: data.dummyOption2, isCorrect: false },
        { text: data.dummyOption3, isCorrect: false }
      ];
      const shuffledOptions = shuffleArray(rawOptions);

      // 選択肢レンダリング（ボタンではなく、美しいテキストリスト）
      optionsContainer.innerHTML = '';
      shuffledOptions.forEach((opt, i) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = "option-item cursor-pointer py-3 px-4 -mx-4 rounded-lg flex items-start opacity-80 hover:opacity-100";
        optionDiv.innerHTML = `
          <span class="text-xs opacity-50 mr-6 mt-1 font-sans">${String(i + 1).padStart(2, '0')}.</span>
          <span class="text-base leading-relaxed">${opt.text}</span>
        `;
        
        optionDiv.onclick = () => selectOption(optionDiv, opt.isCorrect, data);
        optionsContainer.appendChild(optionDiv);
      });

      // アニメーションのリセット
      void questionText.offsetWidth; 
    }

    // 回答選択時
    function selectOption(selectedDiv, isCorrect, data) {
      if (isAnswered) return;
      isAnswered = true;

      const allOptions = optionsContainer.querySelectorAll('.option-item');
      allOptions.forEach(div => {
        div.style.pointerEvents = 'none'; // タップ無効化
        if (div !== selectedDiv) {
          div.style.opacity = '0.2'; // 選ばれなかった選択肢をフェードアウト
        }
      });

      // 選択した項目のハイライト
      selectedDiv.style.opacity = '1';
      selectedDiv.style.fontWeight = '600';

      // 判定結果の静かな表示
      if (isCorrect) {
        resultText.textContent = "Correct";
        resultText.style.color = "#374151"; // チャコールグレーのまま
      } else {
        resultText.textContent = "Incorrect";
        resultText.style.color = "#9CA3AF"; // 少し薄いグレー
      }

      // 解説テキストのセット
      explanationBody.textContent = data.explanation;
      mountPhrase.textContent = `"${data.mountPhrase}"`;
      spotName.textContent = data.spot || "No physical location";

      // 解説エリアをフェードイン
      explanationArea.classList.remove('hidden');
      nextBtn.classList.remove('hidden');

      // スムーズスクロール
      setTimeout(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }, 300);
    }

    // 次のトラックへ
    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < QUIZ_DATABASE.length) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => {
          loadQuestion(currentIndex);
        }, 300); // スクロール後に切り替え
      } else {
        showFinalResult();
      }
    };

    // 終了画面
    function showFinalResult() {
      quizContainer.innerHTML = `
        <div class="text-center fade-in space-y-8 mt-12">
          <div class="text-xs tracking-widest uppercase opacity-60">End of Tour</div>
          <h1 class="text-2xl font-light tracking-widest">Exhibition Completed</h1>
          <div class="museum-divider w-16 mx-auto"></div>
          <p class="text-sm opacity-80 leading-loose">
            Thank you for exploring the depths of Saitama.<br>
            Please return your audio guide to the reception.
          </p>
          <button onclick="location.reload()" class="mt-12 text-xs tracking-widest uppercase opacity-60 hover:opacity-100 transition-opacity">
            Restart Tour
          </button>
        </div>
      `;
      nextBtn.classList.add('hidden');
    }

    // ユーティリティ
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 実行
    initQuiz();
  </script>
</body>
</html>
