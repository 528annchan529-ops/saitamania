<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>サイタマニア - 埼玉完全攻略クイズ</title>
  <!-- Tailwind CSS (軽量スタイリング) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* iOSのタップハイライトやスクロールのバウンドを抑えてネイティブ感を出す */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .slide-in {
      animation: slideIn 0.25s ease-out forwards;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- ヘッダー -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 px-4 py-3 sticky top-0 z-10 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-xl font-black bg-gradient-to-r from-red-500 to-amber-400 bg-clip-text text-transparent">SAITAMANIA</span>
      <span class="text-xs bg-red-950/60 text-red-400 border border-red-800/50 px-2 py-0.5 rounded-full font-bold">埼玉完全攻略</span>
    </div>
    <div id="scoreBadge" class="text-xs font-bold bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">
      正解: <span id="correctCount" class="text-emerald-400">0</span> / <span id="totalCount">0</span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-between">
    
    <!-- クイズカード -->
    <div id="quizContainer" class="slide-in flex-1 flex flex-col">
      <!-- メタ情報バッジ -->
      <div class="flex items-center space-x-2 mb-3">
        <span id="cityBadge" class="text-xs font-semibold bg-blue-900/60 text-blue-300 border border-blue-700/50 px-2 py-0.5 rounded">市町村</span>
        <span id="subThemeBadge" class="text-xs text-slate-400">サブテーマ</span>
        <span id="difficultyBadge" class="ml-auto text-xs font-bold text-amber-400 bg-amber-950/50 border border-amber-800/40 px-2 py-0.5 rounded">初級</span>
      </div>

      <!-- 問題文 -->
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-4 shadow-lg">
        <p id="questionText" class="text-base font-bold leading-relaxed text-slate-100">
          問題を読み込み中...
        </p>
      </div>

      <!-- 4択ボタン群 -->
      <div id="optionsContainer" class="space-y-2.5 mb-4">
        <!-- JSでボタンが動的に挿入されます -->
      </div>

      <!-- 回答後の解説エリア（初期は非表示） -->
      <div id="explanationArea" class="hidden slide-in space-y-3 mb-4">
        <!-- 判定結果バー -->
        <div id="resultBanner" class="p-3 rounded-xl font-bold flex items-center space-x-2 text-sm">
          <span id="resultIcon"></span>
          <span id="resultText"></span>
        </div>

        <!-- マウント雑談フレーズ（★最重要） -->
        <div class="bg-gradient-to-br from-amber-950/40 to-slate-800 border border-amber-600/30 rounded-xl p-3.5 shadow-sm">
          <div class="text-xs font-bold text-amber-400 flex items-center space-x-1 mb-1">
            <span>🗣️ マウント雑談フレーズ</span>
          </div>
          <p id="mountPhrase" class="text-xs text-slate-200 leading-relaxed font-medium"></p>
        </div>

        <!-- 正解解説 & 巡礼スポット -->
        <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3.5 space-y-2 text-xs">
          <div>
            <span class="font-bold text-slate-400 block mb-0.5">【公式解説】</span>
            <p id="explanationText" class="text-slate-300 leading-relaxed"></p>
          </div>
          <div id="spotSection" class="pt-2 border-t border-slate-700 flex items-start space-x-2">
            <span class="text-red-400 shrink-0">📍</span>
            <div>
              <span class="font-bold text-slate-200" id="spotName"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- フッター操作エリア -->
    <div class="pt-2">
      <button id="nextBtn" class="hidden w-full py-3.5 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 active:scale-[0.98] transition-all rounded-xl font-bold text-sm shadow-lg shadow-red-950/40 flex items-center justify-center space-x-1">
        <span>次の問題へ</span>
        <span>→</span>
      </button>
    </div>
  </main>

  <!-- 前半のHTML（<style>や<header><main>など）は前回のコードと全く同じです -->

  <script>
    // ==============================================================
    // ★ GASのウェブアプリURLをここに貼り付けます
    // ==============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzgKf5P9EZi9DACFiL9JWqXpFiBE6qDSgA2ATScYz5pALpMIvDYrknPuieU4FMn-0k/exec";

    let QUIZ_DATABASE = [];
    let currentIndex = 0;
    let correctScore = 0;
    let isAnswered = false;

    // DOM要素（前回と同じ）
    const cityBadge = document.getElementById('cityBadge');
    const subThemeBadge = document.getElementById('subThemeBadge');
    const difficultyBadge = document.getElementById('difficultyBadge');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const explanationArea = document.getElementById('explanationArea');
    const resultBanner = document.getElementById('resultBanner');
    const resultIcon = document.getElementById('resultIcon');
    const resultText = document.getElementById('resultText');
    const mountPhrase = document.getElementById('mountPhrase');
    const explanationText = document.getElementById('explanationText');
    const spotName = document.getElementById('spotName');
    const nextBtn = document.getElementById('nextBtn');
    const correctCountElem = document.getElementById('correctCount');
    const totalCountElem = document.getElementById('totalCount');
    const quizContainer = document.getElementById('quizContainer');

    // ★非同期でスプレッドシートからデータを取得する初期化関数
    async function initQuiz() {
      // ロード中の表示
      questionText.innerHTML = '<span class="animate-pulse">スプレッドシートから最新のクイズを読み込み中... ⏳</span>';
      
      try {
        // GASのAPIを叩く
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data && data.length > 0) {
          // 取得したデータをシャッフルしてセット（毎回違う順番で出題）
          QUIZ_DATABASE = shuffleArray(data);
          
          // 初回は10問だけに絞るなどの処理を入れるのもアリです（今回は全問出題）
          totalCountElem.textContent = QUIZ_DATABASE.length;
          
          // 最初の問題を読み込む
          loadQuestion(0);
        } else {
          questionText.textContent = "クイズデータが0件です。スプレッドシートを確認してください。";
        }
      } catch (error) {
        console.error("API読み込みエラー:", error);
        questionText.textContent = "データの読み込みに失敗しました。インターネット接続やURLを確認してください。";
      }
    }

    // 問題の読み込み（前回と同じ）
    function loadQuestion(index) {
      isAnswered = false;
      explanationArea.classList.add('hidden');
      nextBtn.classList.add('hidden');

      const data = QUIZ_DATABASE[index];
      
      cityBadge.textContent = data.city || "埼玉全域";
      subThemeBadge.textContent = data.subTheme || "";
      difficultyBadge.textContent = data.difficulty || "初級";
      questionText.textContent = `Q${index + 1}. ${data.question}`;

      const rawOptions = [
        { text: data.correctAnswer, isCorrect: true },
        { text: data.dummyOption1, isCorrect: false },
        { text: data.dummyOption2, isCorrect: false },
        { text: data.dummyOption3, isCorrect: false }
      ];
      const shuffledOptions = shuffleArray(rawOptions);

      optionsContainer.innerHTML = '';
      shuffledOptions.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = "option-btn w-full p-3.5 bg-slate-800 hover:bg-slate-750 active:bg-slate-700 border border-slate-700/80 rounded-xl text-left text-xs font-semibold text-slate-200 transition-all flex items-center space-x-3";
        btn.innerHTML = `
          <span class="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-[10px] text-slate-400 font-bold shrink-0">${i + 1}</span>
          <span class="leading-snug">${opt.text}</span>
        `;
        btn.onclick = () => selectOption(btn, opt.isCorrect, data);
        optionsContainer.appendChild(btn);
      });
    }

    // 選択肢タップ時の処理（前回と同じ）
    function selectOption(selectedBtn, isCorrect, data) {
      if (isAnswered) return;
      isAnswered = true;

      const buttons = optionsContainer.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('hover:bg-slate-750', 'active:bg-slate-700');
      });

      if (isCorrect) {
        correctScore++;
        correctCountElem.textContent = correctScore;
        selectedBtn.classList.add('bg-emerald-950/80', 'border-emerald-500', 'text-emerald-200');
        resultBanner.className = "p-3 rounded-xl font-bold flex items-center space-x-2 text-sm bg-emerald-950/60 border border-emerald-600/50 text-emerald-300";
        resultIcon.textContent = "⭕";
        resultText.textContent = "正解！素晴らしい知識です！";
      } else {
        selectedBtn.classList.add('bg-red-950/80', 'border-red-500', 'text-red-200');
        resultBanner.className = "p-3 rounded-xl font-bold flex items-center space-x-2 text-sm bg-red-950/60 border border-red-600/50 text-red-300";
        resultIcon.textContent = "❌";
        resultText.textContent = "不正解！ここで覚えてマウントを取りましょう";
      }

      mountPhrase.textContent = data.mountPhrase;
      explanationText.textContent = data.explanation;
      spotName.textContent = data.spot || "特になし";

      explanationArea.classList.remove('hidden');
      nextBtn.classList.remove('hidden');

      setTimeout(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }, 50);
    }

    // 次の問題へ（前回と同じ）
    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < QUIZ_DATABASE.length) {
        loadQuestion(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showFinalResult();
      }
    };

    // 最終スコア画面（前回と同じ）
    function showFinalResult() {
      const rate = Math.round((correctScore / QUIZ_DATABASE.length) * 100);
      let rankTitle = "彩の国ビギナー";
      if (rate >= 80) rankTitle = "歩く埼玉百科事典（埼玉神）";
      else if (rate >= 50) rankTitle = "さいたまマスター";

      quizContainer.innerHTML = `
        <div class="slide-in bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center space-y-4 my-auto">
          <div class="text-4xl">🏆</div>
          <h2 class="text-lg font-bold text-slate-100">全問題終了！</h2>
          <div class="text-3xl font-black bg-gradient-to-r from-red-400 to-amber-300 bg-clip-text text-transparent">
            ${correctScore} / ${QUIZ_DATABASE.length}問 正解 (${rate}%)
          </div>
          <div class="bg-slate-900 border border-slate-700 rounded-xl p-3">
            <div class="text-xs text-slate-400">あなたの埼玉称号</div>
            <div class="text-base font-bold text-amber-400 mt-1">${rankTitle}</div>
          </div>
          <button onclick="location.reload()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-xs text-slate-200">
            もう一度挑戦する
          </button>
        </div>
      `;
      nextBtn.classList.add('hidden');
    }

    // 配列シャッフル用ユーティリティ
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 起動
    initQuiz();
  </script>
</body>
</html>
