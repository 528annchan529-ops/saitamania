<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER-SAITAMA // PROTOCOL</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#0A0F1D',
              navy: '#0F172A',
              card: '#131D36',
              cyan: '#38BDF8',
              amber: '#F59E0B',
              emerald: '#10B981',
              rose: '#F43F5E',
              border: '#1E293B',
              textMuted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0A0F1D;
      color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* レトロフューチャーなスキャンライン背景 */
    .scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    /* 微小グリッチアニメーション */
    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-1px, 1px) }
      40% { transform: translate(-1px, -1px) }
      60% { transform: translate(1px, 1px) }
      80% { transform: translate(1px, -1px) }
      100% { transform: translate(0) }
    }
    .glitch-hover:hover {
      animation: glitch 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
    }

    /* シャープな直線スライドイン */
    .sharp-slide-in {
      animation: sharpSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes sharpSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* アウトラインボタンのアクティブトランジション */
    .cyber-btn {
      position: relative;
      transition: all 0.15s ease-out;
    }
    .cyber-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 0;
    }
    .cyber-btn:active::before {
      opacity: 0.15;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans relative overflow-x-hidden">
  <div class="fixed inset-0 scanlines z-50"></div>

  <!-- トップバー (ターミナルヘッダー風) -->
  <header class="bg-cyber-navy/90 backdrop-blur-md border-b border-cyber-border px-4 py-2.5 sticky top-0 z-40 flex items-center justify-between font-mono">
    <div class="flex items-center space-x-3">
      <div class="w-2 h-2 rounded-full bg-cyber-cyan animate-pulse"></div>
      <div class="text-xs tracking-wider font-extrabold text-slate-100 flex items-center gap-1.5">
        <span class="text-cyber-cyan">SAITAMA::CORE</span>
        <span class="text-[10px] text-cyber-textMuted font-normal">[v3.6_SECURE]</span>
      </div>
    </div>
    <div class="text-xs text-cyber-textMuted flex items-center space-x-2">
      <span>SYNC_RATE:</span>
      <span id="scoreTracker" class="text-cyber-cyan font-bold">0/0</span>
    </div>
  </header>

  <!-- メインビュー -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-between z-10">
    
    <!-- クイズコンテナ -->
    <div id="quizContainer" class="flex-1 flex flex-col">
      
      <!-- メタデータ / ターミナルタグ -->
      <div class="flex items-center gap-2 mb-3 font-mono text-[11px] flex-wrap">
        <div class="bg-cyber-navy border border-cyber-cyan/30 text-cyber-cyan px-2 py-0.5 rounded-none flex items-center gap-1">
          <span class="text-[9px] opacity-60">LOC:</span>
          <span id="cityBadge" class="font-bold">INITIALIZING</span>
        </div>
        <div class="bg-cyber-navy border border-cyber-border text-slate-400 px-2 py-0.5 rounded-none flex items-center gap-1">
          <span class="text-[9px] opacity-60">TAG:</span>
          <span id="subThemeBadge">-</span>
        </div>
        <div class="ml-auto bg-cyber-navy border border-cyber-amber/40 text-cyber-amber px-2 py-0.5 rounded-none font-bold">
          [<span id="difficultyBadge">AUTH</span>]
        </div>
      </div>

      <!-- 問題カード -->
      <div class="bg-cyber-card border-l-2 border-l-cyber-cyan border-y border-r border-cyber-border p-4 mb-4 shadow-2xl relative">
        <div class="font-mono text-[10px] text-cyber-cyan/60 uppercase tracking-widest mb-1.5">QUERY_DECRYPTED</div>
        <h1 id="questionText" class="text-sm sm:text-base font-bold leading-snug text-slate-100 font-sans">
          システム初期化中... APIからのデータ取得待機中
        </h1>
      </div>

      <!-- 4択ボタン (アウトラインスタイル) -->
      <div id="optionsContainer" class="space-y-2 mb-4 font-sans">
        <!-- JSでボタンが生成されます -->
      </div>

      <!-- 解説エリア (Data Unlocked) -->
      <div id="explanationArea" class="hidden sharp-slide-in space-y-2.5 mb-4 font-sans">
        <!-- ステータスバー -->
        <div id="resultStatus" class="font-mono text-[11px] px-3 py-1.5 border flex items-center justify-between">
          <span id="statusTag" class="font-bold">STATUS: OK</span>
          <span id="statusSub" class="text-[10px] text-cyber-textMuted">DATA_UNLOCKED</span>
        </div>

        <!-- マウントフレーズ（警告色ハイライト） -->
        <div class="bg-cyber-navy/80 border-l-2 border-l-cyber-amber border-y border-r border-cyber-border p-3">
          <div class="font-mono text-[10px] font-bold text-cyber-amber flex items-center gap-1 mb-1">
            <span class="w-1.5 h-1.5 bg-cyber-amber inline-block"></span>
            <span>EXPLOIT_PAYLOAD (雑談マウント):</span>
          </div>
          <p id="mountPhrase" class="text-xs text-slate-200 leading-relaxed font-semibold pl-2.5"></p>
        </div>

        <!-- 公式解説 (タイプライター表示) -->
        <div class="bg-cyber-card/70 border border-cyber-border p-3 space-y-2">
          <div>
            <div class="font-mono text-[10px] text-cyber-textMuted uppercase tracking-wider mb-1">ARCHIVE_LOG:</div>
            <p id="explanationText" class="text-xs text-slate-300 leading-relaxed font-mono min-h-[4rem]"></p>
          </div>
          
          <div id="spotSection" class="pt-2 border-t border-cyber-border/80 flex items-center justify-between font-mono text-[11px]">
            <span class="text-cyber-textMuted text-[10px]">MISSION_TARGET:</span>
            <span id="spotName" class="text-cyber-cyan font-bold"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- コントロールバー -->
    <div class="pt-2">
      <button id="nextBtn" class="hidden w-full py-3 bg-cyber-cyan hover:bg-sky-400 active:scale-[0.99] text-cyber-black font-mono font-extrabold text-xs tracking-wider uppercase transition-all shadow-[0_0_15px_rgba(56,189,248,0.3)]">
        CONTINUE_EXECUTION →
      </button>
    </div>
  </main>

  <script>
    // ==============================================================
    // API設定: デプロイしたGASのWebアプリURLを入力してください
    // ==============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzgKf5P9EZi9DACFiL9JWqXpFiBE6qDSgA2ATScYz5pALpMIvDYrknPuieU4FMn-0k/exec";

    let QUIZ_DATABASE = [];
    let currentIndex = 0;
    let correctScore = 0;
    let isAnswered = false;
    let typewriterTimer = null;

    // DOM要素
    const cityBadge = document.getElementById('cityBadge');
    const subThemeBadge = document.getElementById('subThemeBadge');
    const difficultyBadge = document.getElementById('difficultyBadge');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const explanationArea = document.getElementById('explanationArea');
    const resultStatus = document.getElementById('resultStatus');
    const statusTag = document.getElementById('statusTag');
    const mountPhrase = document.getElementById('mountPhrase');
    const explanationText = document.getElementById('explanationText');
    const spotName = document.getElementById('spotName');
    const nextBtn = document.getElementById('nextBtn');
    const scoreTracker = document.getElementById('scoreTracker');

    // 初期化とAPIフェッチ
    async function initTerminal() {
      questionText.innerHTML = '<span class="font-mono text-xs text-cyber-cyan animate-pulse">CONNECTING TO SAITAMA_DATABASE...</span>';
      
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data && data.length > 0) {
          QUIZ_DATABASE = shuffleArray(data);
          updateScoreDisplay();
          loadQuestion(0);
        } else {
          questionText.innerHTML = '<span class="font-mono text-xs text-cyber-rose">ERROR: NO_RECORDS_FOUND</span>';
        }
      } catch (err) {
        console.error("API_FETCH_FAILURE:", err);
        questionText.innerHTML = '<span class="font-mono text-xs text-cyber-rose">FATAL: DATABASE_CONNECTION_REFUSED</span>';
      }
    }

    // 問題ロード
    function loadQuestion(index) {
      isAnswered = false;
      if (typewriterTimer) clearInterval(typewriterTimer);
      
      explanationArea.classList.add('hidden');
      nextBtn.classList.add('hidden');

      const data = QUIZ_DATABASE[index];
      
      cityBadge.textContent = data.city || "ALL_AREAS";
      subThemeBadge.textContent = data.subTheme || "GENERAL";
      difficultyBadge.textContent = data.difficulty || "LV.1";
      questionText.textContent = data.question;

      // 選択肢シャッフル
      const rawOptions = [
        { text: data.correctAnswer, isCorrect: true },
        { text: data.dummyOption1, isCorrect: false },
        { text: data.dummyOption2, isCorrect: false },
        { text: data.dummyOption3, isCorrect: false }
      ];
      const shuffledOptions = shuffleArray(rawOptions);

      // アウトラインボタンスタイルのレンダリング
      optionsContainer.innerHTML = '';
      shuffledOptions.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = "cyber-btn w-full p-3 bg-cyber-card/40 hover:bg-cyber-navy border border-cyber-border hover:border-cyber-cyan/60 rounded-none text-left text-xs font-semibold text-slate-200 flex items-center justify-between glitch-hover group";
        btn.innerHTML = `
          <div class="flex items-center space-x-3 z-10">
            <span class="font-mono text-[10px] text-cyber-textMuted group-hover:text-cyber-cyan">[0${i + 1}]</span>
            <span class="leading-relaxed">${opt.text}</span>
          </div>
          <span class="font-mono text-[10px] text-cyber-cyan opacity-0 group-hover:opacity-100 transition-opacity z-10">SELECT_</span>
        `;
        btn.onclick = () => selectOption(btn, opt.isCorrect, data);
        optionsContainer.appendChild(btn);
      });
    }

    // 選択肢確定処理
    function selectOption(selectedBtn, isCorrect, data) {
      if (isAnswered) return;
      isAnswered = true;

      const buttons = optionsContainer.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('glitch-hover', 'hover:border-cyber-cyan/60', 'hover:bg-cyber-navy');
      });

      if (isCorrect) {
        correctScore++;
        updateScoreDisplay();
        // 正解: ネオングリーンで塗りつぶし
        selectedBtn.className = "cyber-btn w-full p-3 bg-cyber-emerald border border-cyber-emerald rounded-none text-left text-xs font-bold text-slate-950 flex items-center justify-between";
        resultStatus.className = "font-mono text-[11px] px-3 py-1.5 border bg-cyber-emerald/10 border-cyber-emerald/40 text-cyber-emerald flex items-center justify-between";
        statusTag.textContent = "STATUS: 200_CORRECT";
      } else {
        // 不正解: ネオンローズで塗りつぶし
        selectedBtn.className = "cyber-btn w-full p-3 bg-cyber-rose border border-cyber-rose rounded-none text-left text-xs font-bold text-white flex items-center justify-between";
        resultStatus.className = "font-mono text-[11px] px-3 py-1.5 border bg-cyber-rose/10 border-cyber-rose/40 text-cyber-rose flex items-center justify-between";
        statusTag.textContent = "STATUS: 400_FAILED";
      }

      // マウントフレーズ
      mountPhrase.textContent = data.mountPhrase || "DATA_NOT_FOUND";
      spotName.textContent = data.spot || "NONE";

      explanationArea.classList.remove('hidden');
      nextBtn.classList.remove('hidden');

      // タイプライターエフェクトの実行
      typewriterEffect(explanationText, data.explanation || "No additional records.");
    }

    // タイプライターエフェクト関数
    function typewriterEffect(element, text) {
      element.textContent = "";
      let index = 0;
      if (typewriterTimer) clearInterval(typewriterTimer);
      
      typewriterTimer = setInterval(() => {
        if (index < text.length) {
          element.textContent += text.charAt(index);
          index++;
        } else {
          clearInterval(typewriterTimer);
        }
      }, 15);
    }

    function updateScoreDisplay() {
      scoreTracker.textContent = `${correctScore}/${QUIZ_DATABASE.length}`;
    }

    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < QUIZ_DATABASE.length) {
        loadQuestion(currentIndex);
      } else {
        showTerminalResult();
      }
    };

    function showTerminalResult() {
      const quizContainer = document.getElementById('quizContainer');
      const rate = Math.round((correctScore / QUIZ_DATABASE.length) * 100);
      
      quizContainer.innerHTML = `
        <div class="sharp-slide-in bg-cyber-card border border-cyber-cyan p-6 text-center space-y-4 my-auto font-mono">
          <div class="text-[10px] text-cyber-cyan tracking-widest uppercase">PROTOCOL_COMPLETED</div>
          <div class="text-4xl font-extrabold text-slate-100">${rate}%</div>
          <div class="text-xs text-cyber-textMuted">DATA_INTEGRITY: ${correctScore} / ${QUIZ_DATABASE.length} PASSED</div>
          <div class="border-t border-cyber-border pt-4">
            <button onclick="location.reload()" class="w-full py-3 bg-cyber-navy hover:bg-cyber-border border border-cyber-cyan text-cyber-cyan font-bold text-xs">
              RELOAD_SEQUENCE
            </button>
          </div>
        </div>
      `;
      nextBtn.classList.add('hidden');
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 起動
    initTerminal();
  </script>
</body>
</html>
