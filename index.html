<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAITAMANIA | 埼玉探求の書</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif JP"', 'serif'],
            sans: ['"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            paper: '#FAFAF9',
            ink: '#1C1917',
            subtle: '#78716C',
            accent: '#831843',
            accentLight: '#FCE7F3',
            correct: '#065F46', 
            incorrect: '#991B1B' 
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'float': '0 10px 30px -5px rgba(0, 0, 0, 0.08)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAFAF9;
      -webkit-tap-highlight-color: transparent;
      background-image: radial-gradient(#E7E5E4 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .fade-up {
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(16px);
    }
    .fade-up-delay-1 { animation-delay: 0.1s; }
    .fade-up-delay-2 { animation-delay: 0.2s; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .editorial-quote::before {
      content: '“';
      position: absolute;
      top: -10px;
      left: -5px;
      font-size: 4rem;
      color: rgba(131, 24, 67, 0.1);
      font-family: serif;
      line-height: 1;
    }
    .glass-header {
      background: rgba(250, 250, 249, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .option-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .option-card:active:not(:disabled) {
      transform: scale(0.98);
      box-shadow: 0 2px 8px -2px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body class="text-ink font-sans min-h-screen flex flex-col selection:bg-accentLight selection:text-accent">

  <!-- ヘッダー -->
  <header class="glass-header border-b border-stone-200 px-4 py-4 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <button id="backBtn" class="hidden text-stone-500 hover:text-ink transition-colors p-1" onclick="goBack()" aria-label="前の問題に戻る">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="font-serif tracking-widest text-lg font-bold text-accent">
        SAITAMANIA
      </div>
    </div>
    <!-- ★初期状態（開始画面）ではスコアを隠す -->
    <div id="scoreBadge" class="hidden text-xs font-medium text-subtle tracking-widest border border-stone-200 rounded-full px-3 py-1 bg-white/50">
      <span id="correctCount" class="text-ink font-bold">0</span> / <span id="totalCount">0</span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-lg w-full mx-auto p-6 pb-24 flex flex-col">
    
    <!-- ========================================== -->
    <!-- 開始画面（Start Screen） -->
    <!-- ========================================== -->
    <div id="startScreen" class="flex-1 flex flex-col justify-center items-center text-center fade-up">
      <div class="mb-10">
        <h1 class="font-serif text-4xl md:text-5xl font-black text-accent tracking-widest mb-3">SAITAMANIA</h1>
        <p class="font-serif text-subtle tracking-widest text-sm uppercase">埼玉探求の書</p>
      </div>

      <!-- データロード中表示 -->
      <div id="loadingStatus" class="text-stone-400 font-serif tracking-widest text-sm animate-pulse mb-8">
        叡智を読み込んでいます...
      </div>

      <!-- 出題数選択コントロール（データ読み込み後に表示） -->
      <div id="startControls" class="hidden w-full max-w-xs mx-auto bg-white border border-stone-100 rounded-3xl p-8 shadow-float fade-up-delay-1">
        <p class="text-xs font-bold text-stone-400 tracking-widest mb-6 uppercase">探求する問題数</p>
        
        <div class="flex items-center justify-between mb-6">
          <button onclick="adjustCount(-5)" class="w-12 h-12 rounded-full bg-stone-50 border border-stone-200 text-stone-500 hover:bg-stone-100 active:scale-95 transition-all flex items-center justify-center text-xl font-serif shadow-sm">
            －
          </button>
          
          <div class="font-serif text-4xl text-ink font-bold w-20 text-center">
            <span id="selectedCountDisplay">10</span>
          </div>
          
          <button onclick="adjustCount(5)" class="w-12 h-12 rounded-full bg-stone-50 border border-stone-200 text-stone-500 hover:bg-stone-100 active:scale-95 transition-all flex items-center justify-center text-xl font-serif shadow-sm">
            ＋
          </button>
        </div>

        <button onclick="setCountToMax()" class="text-xs text-accent underline underline-offset-4 mb-8 tracking-wide">
          全問（<span id="maxCountText">0</span>問）に挑む
        </button>

        <button onclick="beginQuest()" class="w-full py-4 bg-accent hover:bg-accent/90 text-white rounded-xl font-serif font-bold tracking-widest shadow-float active:scale-95 transition-all flex items-center justify-center space-x-2">
          <span>探求を始める</span>
        </button>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- クイズ画面（Quiz App） -->
    <!-- ========================================== -->
    <div id="quizApp" class="hidden flex-1 flex flex-col justify-center">
      
      <div id="metaTags" class="flex items-center space-x-3 mb-6">
        <span id="cityBadge" class="text-xs font-serif font-bold tracking-widest text-accent border-b border-accent pb-0.5"></span>
        <span class="text-stone-300">|</span>
        <span id="subThemeBadge" class="text-xs text-subtle tracking-wide"></span>
      </div>

      <div class="mb-10">
        <h2 id="questionText" class="font-serif text-2xl md:text-3xl font-semibold leading-relaxed tracking-wide"></h2>
      </div>

      <div id="optionsContainer" class="space-y-4"></div>

      <div id="explanationArea" class="hidden mt-10 space-y-8">
        <div class="text-center border-b border-stone-200 pb-4">
          <span id="resultIcon" class="text-2xl mr-2"></span>
          <span id="resultText" class="font-serif font-bold text-lg tracking-wide"></span>
        </div>
        <div class="relative editorial-quote pl-6 pr-2">
          <p class="text-xs font-bold text-accent tracking-widest mb-2 uppercase">Dialogue / 語り口</p>
          <p id="mountPhrase" class="font-serif text-lg leading-relaxed text-ink"></p>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-soft border border-stone-100">
          <p class="text-xs font-bold text-subtle tracking-widest mb-3 uppercase">Fact / 史実と背景</p>
          <p id="explanationText" class="text-sm leading-relaxed text-stone-700"></p>
        </div>
        <div class="bg-stone-800 text-paper rounded-2xl p-6 shadow-float relative overflow-hidden group">
          <div class="absolute -right-4 -top-4 w-24 h-24 bg-accent/20 rounded-full blur-2xl"></div>
          <p class="text-xs font-bold text-stone-400 tracking-widest mb-2 uppercase relative z-10">Destination / 巡礼地</p>
          <h3 id="spotName" class="font-serif text-xl font-bold mb-4 relative z-10 leading-snug"></h3>
          <button onclick="searchSpot()" class="relative z-10 w-full py-3 bg-paper text-ink hover:bg-stone-200 transition-colors rounded-xl text-sm font-bold tracking-wide flex items-center justify-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>地図で場所を確認する</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- フッター固定 次へボタン -->
  <div id="footerAction" class="hidden fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-paper via-paper to-transparent z-40">
    <button id="nextBtn" class="max-w-lg mx-auto w-full py-4 bg-accent hover:bg-accent/90 text-white shadow-float rounded-xl font-serif tracking-widest transition-transform active:scale-95 flex items-center justify-center space-x-2">
      <span>次の探求へ</span>
      <span class="text-xl">→</span>
    </button>
  </div>

  <script>
    // ==============================================================
    // ★ GASのウェブアプリURLをここに貼り付けてください
    // ==============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzgKf5P9EZi9DACFiL9JWqXpFiBE6qDSgA2ATScYz5pALpMIvDYrknPuieU4FMn-0k/exec";

    let MASTER_DATABASE = []; // 取得した全データ
    let QUIZ_DATABASE = [];   // 出題用に絞り込まれたデータ
    
    let currentIndex = 0;
    let scoreHistory = []; 
    let isAnswered = false;
    let currentSpotName = ""; 

    let selectedQuestionCount = 10;
    let maxAvailableQuestions = 0;

    // DOM Elements
    const startScreen = document.getElementById('startScreen');
    const loadingStatus = document.getElementById('loadingStatus');
    const startControls = document.getElementById('startControls');
    const selectedCountDisplay = document.getElementById('selectedCountDisplay');
    const maxCountText = document.getElementById('maxCountText');
    
    const quizApp = document.getElementById('quizApp');
    const scoreBadge = document.getElementById('scoreBadge');
    const backBtn = document.getElementById('backBtn');
    const cityBadge = document.getElementById('cityBadge');
    const subThemeBadge = document.getElementById('subThemeBadge');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const explanationArea = document.getElementById('explanationArea');
    const resultIcon = document.getElementById('resultIcon');
    const resultText = document.getElementById('resultText');
    const mountPhrase = document.getElementById('mountPhrase');
    const explanationText = document.getElementById('explanationText');
    const spotName = document.getElementById('spotName');
    const footerAction = document.getElementById('footerAction');
    const nextBtn = document.getElementById('nextBtn');
    const correctCountElem = document.getElementById('correctCount');
    const totalCountElem = document.getElementById('totalCount');

    // 初期化：APIから全データ取得
    async function initQuiz() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data && data.length > 0) {
          MASTER_DATABASE = data;
          maxAvailableQuestions = data.length;
          
          // 問題数が少ない場合はデフォルト値を調整
          selectedQuestionCount = Math.min(10, maxAvailableQuestions);
          
          // 開始画面のUIを更新
          loadingStatus.classList.add('hidden');
          startControls.classList.remove('hidden');
          selectedCountDisplay.textContent = selectedQuestionCount;
          maxCountText.textContent = maxAvailableQuestions;
          
        } else {
          loadingStatus.textContent = "記録が見つかりません。データベースを確認してください。";
        }
      } catch (error) {
        console.error("API Error:", error);
        loadingStatus.textContent = "通信の乱れにより、探求の書を開けませんでした。";
      }
    }

    // 出題数の調整（+/- ボタン）
    function adjustCount(delta) {
      selectedQuestionCount += delta;
      
      // 最小1問、最大はデータベースの全件数までに制限
      if (selectedQuestionCount < 1) selectedQuestionCount = 1;
      if (selectedQuestionCount > maxAvailableQuestions) selectedQuestionCount = maxAvailableQuestions;
      
      selectedCountDisplay.textContent = selectedQuestionCount;
    }

    // 全問を選択
    function setCountToMax() {
      selectedQuestionCount = maxAvailableQuestions;
      selectedCountDisplay.textContent = selectedQuestionCount;
    }

    // クイズ開始処理
    function beginQuest() {
      // データベースをシャッフルし、選択された数だけ切り出す
      QUIZ_DATABASE = shuffleArray([...MASTER_DATABASE]).slice(0, selectedQuestionCount);
      
      totalCountElem.textContent = QUIZ_DATABASE.length;
      scoreHistory = new Array(QUIZ_DATABASE.length).fill(null);
      currentIndex = 0;
      
      // 画面の切り替え
      startScreen.classList.add('hidden');
      quizApp.classList.remove('hidden');
      scoreBadge.classList.remove('hidden');
      
      loadQuestion(0);
    }

    function updateScoreDisplay() {
      const correctScore = scoreHistory.filter(val => val === true).length;
      correctCountElem.textContent = correctScore;
    }

    function loadQuestion(index) {
      isAnswered = false;
      explanationArea.classList.add('hidden');
      footerAction.classList.add('hidden');
      
      if (index === 0) {
        backBtn.classList.add('hidden');
      } else {
        backBtn.classList.remove('hidden');
      }

      updateScoreDisplay();

      const metaTags = document.getElementById('metaTags');
      metaTags.classList.remove('fade-up');
      void metaTags.offsetWidth; 
      metaTags.classList.add('fade-up');

      const data = QUIZ_DATABASE[index];
      
      cityBadge.textContent = data.city || "埼玉全域";
      subThemeBadge.textContent = data.subTheme || "未分類";
      questionText.innerHTML = `Q${index + 1}.<br>${data.question}`;

      const rawOptions = [
        { text: data.correctAnswer, isCorrect: true },
        { text: data.dummyOption1, isCorrect: false },
        { text: data.dummyOption2, isCorrect: false },
        { text: data.dummyOption3, isCorrect: false }
      ].filter(opt => opt.text); 

      data.shuffledOptions = shuffleArray(rawOptions);

      optionsContainer.innerHTML = '';
      data.shuffledOptions.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = "option-card fade-up w-full p-5 bg-white border border-stone-100 shadow-soft rounded-2xl text-left font-medium text-stone-700 flex items-center space-x-4";
        btn.style.animationDelay = `${i * 0.1}s`;
        
        btn.dataset.isCorrect = opt.isCorrect;
        
        btn.innerHTML = `
          <span class="badge w-8 h-8 rounded-full border border-stone-200 flex items-center justify-center text-xs font-serif text-stone-400 shrink-0 bg-stone-50">${String.fromCharCode(65 + i)}</span>
          <span class="leading-relaxed">${opt.text}</span>
        `;
        btn.onclick = () => selectOption(btn, opt.isCorrect, data);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, isCorrect, data) {
      if (isAnswered) return;
      isAnswered = true;

      scoreHistory[currentIndex] = isCorrect;
      updateScoreDisplay();

      const buttons = optionsContainer.querySelectorAll('button');
      
      buttons.forEach(btn => {
        btn.disabled = true;
        const badge = btn.querySelector('.badge');
        
        if (btn.dataset.isCorrect === "true") {
          btn.classList.add('bg-emerald-50', 'border-emerald-200', 'text-correct', 'font-bold', 'opacity-100', 'shadow-md');
          btn.classList.remove('bg-white', 'border-stone-100');
          badge.classList.add('bg-emerald-100', 'border-emerald-300', 'text-emerald-700');
        } else {
          btn.classList.add('opacity-40'); 
        }
      });

      if (!isCorrect) {
        selectedBtn.classList.remove('opacity-40', 'bg-white', 'border-stone-100');
        selectedBtn.classList.add('bg-red-50', 'border-red-200', 'text-incorrect', 'font-bold', 'opacity-100');
        const badge = selectedBtn.querySelector('.badge');
        badge.classList.add('bg-red-100', 'border-red-300', 'text-red-700');
        
        resultIcon.textContent = "✦";
        resultText.textContent = "不正解";
        resultText.className = "font-serif font-bold text-xl tracking-widest text-incorrect";
      } else {
        resultIcon.textContent = "✧";
        resultText.textContent = "正解";
        resultText.className = "font-serif font-bold text-xl tracking-widest text-correct";
      }

      mountPhrase.textContent = data.mountPhrase;
      explanationText.textContent = data.explanation;
      
      currentSpotName = data.spot || "埼玉県";
      spotName.textContent = currentSpotName;

      explanationArea.classList.remove('hidden');
      explanationArea.classList.add('fade-up');
      
      footerAction.classList.remove('hidden');

      setTimeout(() => {
        footerAction.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 100);
    }

    function goBack() {
      if (currentIndex > 0) {
        scoreHistory[currentIndex] = null;
        currentIndex--;
        scoreHistory[currentIndex] = null;
        
        loadQuestion(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function searchSpot() {
      const query = encodeURIComponent(currentSpotName);
      window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
    }

    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < QUIZ_DATABASE.length) {
        loadQuestion(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showFinalResult();
      }
    };

    function showFinalResult() {
      const correctScore = scoreHistory.filter(val => val === true).length;
      const rate = Math.round((correctScore / QUIZ_DATABASE.length) * 100);
      
      quizApp.innerHTML = `
        <div class="fade-up bg-white border border-stone-100 rounded-3xl p-8 text-center shadow-float my-auto">
          <p class="font-serif text-accent tracking-widest text-sm mb-6">探求の記録</p>
          <div class="font-serif text-4xl text-ink mb-2">
            ${correctScore} <span class="text-xl text-stone-400 mx-1">/</span> ${QUIZ_DATABASE.length}
          </div>
          <p class="text-sm text-subtle mb-10">正答率 ${rate}%</p>
          
          <button onclick="location.reload()" class="w-full py-4 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl font-serif tracking-widest transition-colors">
            トップに戻る
          </button>
        </div>
      `;
      footerAction.classList.add('hidden');
      backBtn.classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // アプリ起動時にデータ取得を実行
    initQuiz();
  </script>
</body>
</html>
