<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>サイタマニア - ポップクイズ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (丸みのあるフォント) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- 紙吹雪ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"M PLUS Rounded 1c"', 'sans-serif'] },
          colors: {
            saitama: {
              bg: '#F3F4F6', card: '#FFFFFF', text: '#374151',
              primary: '#10B981', primaryDark: '#059669', primaryShadow: '#047857',
              accent: '#3B82F6', wrong: '#EF4444', wrongShadow: '#B91C1C',
            }
          },
          boxShadow: { 'squishy': '0 4px 0 0', 'squishy-active': '0 0px 0 0' },
          animation: {
            'slide-up': 'slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite'
          },
          keyframes: {
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            pop: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #F3F4F6; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    .btn-squishy { transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
    .btn-squishy:active:not(:disabled) { transform: translateY(4px); }
    .speech-bubble::after {
      content: ''; position: absolute; bottom: -10px; left: 24px;
      border-width: 10px 10px 0; border-style: solid;
      border-color: #FEF3C7 transparent transparent transparent; display: block; width: 0;
    }
  </style>
</head>
<body class="text-saitama-text h-screen flex flex-col font-sans overflow-hidden">

  <!-- ヘッダー -->
  <header class="px-5 pt-6 pb-2 shrink-0">
    <div class="flex items-center justify-between mb-2">
      <div class="font-black text-xl text-saitama-primary tracking-wider">SAITAMANIA</div>
      <div class="flex items-center space-x-1 text-saitama-accent font-bold bg-blue-50 px-3 py-1 rounded-full border-2 border-blue-200">
        <i data-lucide="award" class="w-4 h-4"></i>
        <span id="scoreText">0 / 0</span>
      </div>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden relative">
      <div id="progressBar" class="bg-saitama-primary h-4 rounded-full transition-all duration-500 ease-out" style="width: 0%">
        <div class="absolute top-1 left-2 right-2 h-1 bg-white/30 rounded-full"></div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 overflow-y-auto px-5 pb-24 pt-2 flex flex-col space-y-4">
    
    <div id="badgeContainer" class="flex items-center space-x-2 animate-pop hidden">
      <span id="badgeCity" class="bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-xl text-sm border-2 border-indigo-200 shadow-sm"></span>
      <span id="badgeTheme" class="bg-white text-gray-500 font-bold px-3 py-1 rounded-xl text-sm border-2 border-gray-200 shadow-sm"></span>
    </div>

    <!-- 問題カード -->
    <div class="bg-saitama-card rounded-3xl p-6 border-2 border-gray-200 shadow-sm animate-pop">
      <h2 id="questionText" class="text-lg md:text-xl font-bold leading-relaxed text-gray-800 animate-pulse-fast text-center py-4">
        最新のクイズデータを<br>ダウンロード中...
      </h2>
    </div>

    <!-- 選択肢グリッド -->
    <div id="optionsContainer" class="grid grid-cols-1 gap-3 mt-2"></div>

    <!-- 解説モーダルカード -->
    <div id="explanationCard" class="hidden animate-slide-up flex flex-col space-y-4 pt-4">
      <div id="resultBanner" class="rounded-2xl p-4 font-black text-xl text-center border-b-4">
        <span id="resultIcon"></span> <span id="resultTitle"></span>
      </div>
      <div class="relative bg-amber-100 border-2 border-amber-300 rounded-3xl p-5 speech-bubble mt-2">
        <div class="flex items-center space-x-2 mb-2 text-amber-600 font-black">
          <i data-lucide="message-circle" class="w-5 h-5"></i>
          <span>会話で使える！マウントフレーズ</span>
        </div>
        <p id="mountText" class="font-bold text-gray-800 leading-relaxed"></p>
      </div>
      <div class="bg-white rounded-3xl p-5 border-2 border-gray-200 shadow-sm mt-4">
        <div class="mb-4">
          <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">解説</span>
          <p id="explanationText" class="text-gray-700 font-medium leading-relaxed"></p>
        </div>
        <div class="pt-3 border-t-2 border-gray-100 flex items-start space-x-2">
          <i data-lucide="map-pin" class="w-5 h-5 text-red-500 shrink-0 mt-0.5"></i>
          <div>
            <span class="text-xs font-bold text-gray-400 block mb-0.5">巡礼スポット</span>
            <span id="spotText" class="font-bold text-gray-800"></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- フッター固定アクションボタン -->
  <div id="footerAction" class="hidden fixed bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-gray-100 via-gray-100/90 to-transparent">
    <button id="nextBtn" class="btn-squishy w-full bg-saitama-primary text-white font-black text-lg py-4 rounded-2xl shadow-squishy shadow-saitama-primaryShadow border-2 border-saitama-primaryDark hover:bg-emerald-400">
      つぎへ進む
    </button>
  </div>

  <script>
    lucide.createIcons();

    // =========================================================================
    // ★ ここにGASで発行したウェブアプリのURL（https://script.google.com/...）を貼る
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzgKf5P9EZi9DACFiL9JWqXpFiBE6qDSgA2ATScYz5pALpMIvDYrknPuieU4FMn-0k/exec"; 
    
    let quizDatabase = [];
    let currentIndex = 0;
    let correctScore = 0;
    let isAnswered = false;

    const el = {
      progress: document.getElementById('progressBar'),
      score: document.getElementById('scoreText'),
      badgeContainer: document.getElementById('badgeContainer'),
      badgeCity: document.getElementById('badgeCity'),
      badgeTheme: document.getElementById('badgeTheme'),
      question: document.getElementById('questionText'),
      options: document.getElementById('optionsContainer'),
      expCard: document.getElementById('explanationCard'),
      resBanner: document.getElementById('resultBanner'),
      resIcon: document.getElementById('resultIcon'),
      resTitle: document.getElementById('resultTitle'),
      mount: document.getElementById('mountText'),
      expText: document.getElementById('explanationText'),
      spot: document.getElementById('spotText'),
      footer: document.getElementById('footerAction'),
      nextBtn: document.getElementById('nextBtn'),
    };

    // 初期化（API通信）
    async function init() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data && data.length > 0) {
          quizDatabase = shuffleArray(data);
          updateScore();
          el.question.classList.remove('animate-pulse-fast', 'text-center', 'py-4');
          el.badgeContainer.classList.remove('hidden');
          loadQuestion();
        } else {
          showError("クイズデータが見つかりません。スプレッドシートを確認してください。");
        }
      } catch (e) {
        console.error(e);
        showError("通信エラーが発生しました。<br>GASのURL設定やアクセス権限を確認してください。");
      }
    }

    function showError(msg) {
      el.question.classList.remove('animate-pulse-fast');
      el.question.innerHTML = `<span class="text-red-500 font-bold">⚠️ エラー</span><br><span class="text-sm font-medium">${msg}</span>`;
    }

    function loadQuestion() {
      isAnswered = false;
      el.expCard.classList.add('hidden');
      el.footer.classList.add('hidden');
      
      const q = quizDatabase[currentIndex];
      
      const progressPercent = (currentIndex / quizDatabase.length) * 100;
      el.progress.style.width = `${progressPercent}%`;
      
      el.badgeCity.textContent = q.city || "埼玉全域";
      el.badgeTheme.textContent = q.subTheme || "雑学";
      el.question.textContent = q.question;

      const options = [
        { text: q.correctAnswer, correct: true },
        { text: q.dummyOption1, correct: false },
        { text: q.dummyOption2, correct: false },
        { text: q.dummyOption3, correct: false }
      ];
      
      el.options.innerHTML = '';
      shuffleArray(options).forEach(opt => {
        const btn = document.createElement('button');
        btn.className = `btn-squishy w-full text-left bg-white border-2 border-gray-200 rounded-2xl p-4 font-bold text-gray-700 shadow-squishy shadow-gray-200`;
        btn.innerHTML = `<span class="text-[15px] leading-snug">${opt.text}</span>`;
        btn.onclick = () => handleAnswer(btn, opt.correct, q);
        el.options.appendChild(btn);
      });
    }

    function handleAnswer(selectedBtn, isCorrect, q) {
      if (isAnswered) return;
      isAnswered = true;

      const allBtns = el.options.querySelectorAll('button');
      allBtns.forEach(b => {
        b.disabled = true;
        b.className = `w-full text-left bg-gray-50 border-2 border-gray-200 rounded-2xl p-4 font-bold text-gray-400 opacity-60`;
      });

      if (isCorrect) {
        correctScore++;
        updateScore();
        selectedBtn.className = `w-full text-left bg-emerald-50 border-2 border-saitama-primary rounded-2xl p-4 font-bold text-saitama-primaryDark shadow-squishy-active`;
        
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#10B981', '#3B82F6', '#F59E0B'] });

        el.resBanner.className = "rounded-2xl p-4 font-black text-xl text-center border-b-4 bg-emerald-100 text-emerald-600 border-emerald-300";
        el.resIcon.textContent = "🎉";
        el.resTitle.textContent = "大正解！";
      } else {
        selectedBtn.className = `w-full text-left bg-red-50 border-2 border-saitama-wrong rounded-2xl p-4 font-bold text-saitama-wrong shadow-squishy-active`;
        
        el.resBanner.className = "rounded-2xl p-4 font-black text-xl text-center border-b-4 bg-red-100 text-red-500 border-red-300";
        el.resIcon.textContent = "💦";
        el.resTitle.textContent = "ざんねん！";
      }

      el.mount.textContent = q.mountPhrase;
      el.expText.textContent = q.explanation;
      el.spot.textContent = q.spot || "指定なし";

      el.expCard.classList.remove('hidden');
      el.footer.classList.remove('hidden');

      setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
    }

    el.nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < quizDatabase.length) {
        loadQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResult();
      }
    };

    function updateScore() {
      el.score.textContent = `${correctScore} / ${quizDatabase.length}`;
    }

    function showResult() {
      el.progress.style.width = '100%';
      el.badgeContainer.classList.add('hidden');
      el.options.classList.add('hidden');
      el.expCard.classList.add('hidden');
      el.footer.innerHTML = `<button onclick="location.reload()" class="btn-squishy w-full bg-saitama-accent text-white font-black text-lg py-4 rounded-2xl shadow-squishy shadow-blue-700 border-2 border-blue-600 hover:bg-blue-400">もう一度あそぶ</button>`;
      
      const rate = Math.round((correctScore / quizDatabase.length) * 100);
      
      el.question.parentElement.innerHTML = `
        <div class="text-center py-8">
          <div class="text-6xl mb-4">🏆</div>
          <h2 class="text-2xl font-black text-gray-800 mb-2">クイズ完了！</h2>
          <p class="text-4xl font-black text-saitama-primary mb-6">${correctScore}問正解 <span class="text-lg text-gray-500">/ ${quizDatabase.length}問</span></p>
          <div class="bg-gray-100 rounded-2xl p-4 border-2 border-gray-200 inline-block">
            <span class="text-sm font-bold text-gray-500 block">正答率</span>
            <span class="text-2xl font-black text-gray-800">${rate}%</span>
          </div>
        </div>
      `;
    }

    function shuffleArray(arr) {
      return arr.sort(() => Math.random() - 0.5);
    }

    // アプリ起動
    init();
  </script>
</body>
</html>
