<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Secret Guide - Saitama</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: 游明朝に近いNoto Serif JP（見出し・ラグジュアリー感）と、Noto Sans JP（本文） -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif JP"', 'serif'],
            sans: ['"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            // ディープネイビー背景
            luxuryBg: '#0b101a',
            luxuryPanel: '#131b2a',
            // シャンパンゴールド系
            champagne: '#D4AF37',
            champagneLight: '#F3E5AB',
            champagneDark: '#AA8822',
            // オフホワイト系
            offWhite: '#F8F9FA',
            mutedWhite: '#A0ABC0'
          }
        }
      }
    }
  </script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #0b101a;
      /* 背景にうっすらとノイズ/テクスチャ感を出す */
      background-image: radial-gradient(circle at 50% 0%, #1a253a 0%, #0b101a 70%);
      background-attachment: fixed;
    }

    /* エレガントなフェードイン */
    .fade-in {
      animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glassmorphism（すりガラス） */
    .glass-panel {
      background: rgba(19, 27, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.15); /* 極細のゴールドボーダー */
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    /* 選択肢ボタン（ゴールドアウトライン＆シマー） */
    .option-card {
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    
    .option-card::before {
      content: '';
      position: absolute;
      top: 0; left: -150%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(212, 175, 55, 0.15), transparent);
      transform: skewX(-25deg);
      transition: all 0.6s ease;
    }

    .option-card:hover::before, .option-card:active::before {
      left: 150%;
      transition: all 0.6s ease;
    }

    .option-card:active {
      transform: scale(0.98);
      background: rgba(212, 175, 55, 0.05);
    }

    /* 正解/不正解時のスタイル */
    .option-correct {
      background: rgba(212, 175, 55, 0.15);
      border-color: #D4AF37;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }
    .option-wrong {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
      opacity: 0.6;
    }

    /* コンシェルジュのメッセージエリア */
    .concierge-quote {
      border-left: 2px solid #D4AF37;
      background: linear-gradient(to right, rgba(212, 175, 55, 0.05), transparent);
    }
  </style>
</head>
<body class="text-offWhite min-h-screen flex flex-col font-sans">

  <!-- ヘッダー（ホテルライク） -->
  <header class="pt-8 pb-4 px-6 text-center z-10">
    <h1 class="font-serif tracking-widest text-champagne text-xs uppercase mb-1">The Secret Guide</h1>
    <div class="h-[1px] w-12 bg-champagne mx-auto mb-2 opacity-50"></div>
    <div id="metaBadge" class="text-xs font-light text-mutedWhite tracking-wider">
      Loading...
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-md w-full mx-auto px-5 pb-8 flex flex-col justify-center">
    
    <!-- ローディング表示 -->
    <div id="loadingView" class="text-center font-serif text-champagne animate-pulse">
      <p class="text-sm tracking-widest">Retrieving the secrets...</p>
    </div>

    <!-- クイズエリア -->
    <div id="quizContainer" class="hidden flex-1 flex-col justify-center">
      
      <!-- 問題カード -->
      <div class="glass-panel rounded-lg p-6 mb-8 relative fade-in">
        <!-- アクセントのコーナー装飾 -->
        <div class="absolute top-0 left-0 w-3 h-3 border-t border-l border-champagne opacity-50 rounded-tl-lg"></div>
        <div class="absolute bottom-0 right-0 w-3 h-3 border-b border-r border-champagne opacity-50 rounded-br-lg"></div>
        
        <p id="questionText" class="font-serif text-lg leading-loose text-offWhite text-center">
          <!-- 問題文がここに入ります -->
        </p>
      </div>

      <!-- 選択肢群 -->
      <div id="optionsContainer" class="space-y-4 mb-6 fade-in" style="animation-delay: 0.1s;">
        <!-- ボタンが動的に挿入されます -->
      </div>

      <!-- 解説エリア（初期非表示） -->
      <div id="explanationArea" class="hidden fade-in space-y-6">
        
        <!-- コンシェルジュのメッセージ（マウントひと言） -->
        <div class="concierge-quote p-4 rounded-r-lg">
          <p class="font-serif italic text-champagneLight text-sm leading-relaxed" id="mountPhrase">
            <!-- マウントひと言 -->
          </p>
        </div>

        <!-- 公式解説 -->
        <div class="text-sm font-light leading-loose text-mutedWhite px-2">
          <p id="explanationText"></p>
        </div>

        <!-- 巡礼スポット -->
        <div class="flex items-center space-x-3 px-2 pt-4 border-t border-white/10">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-champagne" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span id="spotName" class="text-xs tracking-wider text-champagneLight uppercase"></span>
        </div>
      </div>
    </div>

    <!-- 次へボタン -->
    <div class="mt-8">
      <button id="nextBtn" class="hidden w-full py-4 bg-transparent border border-champagne text-champagne hover:bg-champagne hover:text-luxuryBg transition-colors duration-300 rounded font-serif tracking-widest text-sm uppercase">
        Turn the Page
      </button>
    </div>
  </main>

  <script>
    // ==============================================================
    // ★ GASのウェブアプリURLをここに貼り付けてください
    // ==============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzgKf5P9EZi9DACFiL9JWqXpFiBE6qDSgA2ATScYz5pALpMIvDYrknPuieU4FMn-0k/exec";

    let QUIZ_DATABASE = [];
    let currentIndex = 0;
    let isAnswered = false;

    // DOM Elements
    const metaBadge = document.getElementById('metaBadge');
    const loadingView = document.getElementById('loadingView');
    const quizContainer = document.getElementById('quizContainer');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const explanationArea = document.getElementById('explanationArea');
    const mountPhrase = document.getElementById('mountPhrase');
    const explanationText = document.getElementById('explanationText');
    const spotName = document.getElementById('spotName');
    const nextBtn = document.getElementById('nextBtn');

    // 初期化（データ取得）
    async function initQuiz() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data && data.length > 0) {
          QUIZ_DATABASE = shuffleArray(data);
          loadingView.classList.add('hidden');
          quizContainer.classList.remove('hidden');
          quizContainer.classList.add('flex');
          loadQuestion(0);
        } else {
          loadingView.innerHTML = "<p>The guide is currently empty.</p>";
        }
      } catch (error) {
        console.error("API Error:", error);
        loadingView.innerHTML = "<p>Connection failed. Please check the URL.</p>";
      }
    }

    // 問題の読み込み
    function loadQuestion(index) {
      isAnswered = false;
      explanationArea.classList.add('hidden');
      optionsContainer.classList.remove('hidden');
      nextBtn.classList.add('hidden');

      const data = QUIZ_DATABASE[index];
      
      // メタデータ（Secret #01 - Chichibu のような形）
      const cityEn = data.city ? data.city : "Saitama";
      metaBadge.textContent = `Secret #${String(index + 1).padStart(2, '0')} — ${cityEn}`;
      
      questionText.textContent = data.question;

      const rawOptions = [
        { text: data.correctAnswer, isCorrect: true },
        { text: data.dummyOption1, isCorrect: false },
        { text: data.dummyOption2, isCorrect: false },
        { text: data.dummyOption3, isCorrect: false }
      ];
      const shuffledOptions = shuffleArray(rawOptions);

      optionsContainer.innerHTML = '';
      shuffledOptions.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = "option-card w-full py-4 px-6 rounded text-left font-serif text-sm tracking-wide text-offWhite flex items-center justify-between";
        btn.innerHTML = `
          <span>${opt.text}</span>
          <span class="w-1.5 h-1.5 rounded-full bg-champagne/30 hidden indicator"></span>
        `;
        btn.onclick = () => selectOption(btn, opt.isCorrect, data);
        optionsContainer.appendChild(btn);
      });
    }

    // 選択肢タップ時の処理
    function selectOption(selectedBtn, isCorrect, data) {
      if (isAnswered) return;
      isAnswered = true;

      const buttons = optionsContainer.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.disabled = true;
        btn.classList.add('cursor-default');
        
        // 選ばれたボタンかつ正解
        if (btn === selectedBtn && isCorrect) {
          btn.classList.add('option-correct');
          btn.querySelector('.indicator').classList.remove('hidden', 'bg-champagne/30');
          btn.querySelector('.indicator').classList.add('bg-champagne');
        } 
        // 選ばれたボタンだが不正解
        else if (btn === selectedBtn && !isCorrect) {
          btn.classList.add('border-red-900/50', 'bg-red-950/20', 'text-red-200/70');
        }
        // 選ばれていないボタン
        else {
          btn.classList.add('option-wrong');
        }
      });

      // スムーズな遷移のため、少し待ってから解説を表示
      setTimeout(() => {
        optionsContainer.classList.add('hidden'); // 選択肢を消して解説に集中させるエディトリアル仕様
        
        mountPhrase.innerHTML = `&ldquo; ${data.mountPhrase} &rdquo;`;
        explanationText.textContent = data.explanation;
        spotName.textContent = data.spot || "Secret Location";

        explanationArea.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
      }, 600); // フリップを待つ間のタメ
    }

    // 次へボタン
    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < QUIZ_DATABASE.length) {
        // フェードアウト効果
        quizContainer.classList.remove('fade-in');
        void quizContainer.offsetWidth; // リフロー強制
        quizContainer.classList.add('fade-in');
        
        loadQuestion(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showFinalResult();
      }
    };

    // 最終画面
    function showFinalResult() {
      metaBadge.textContent = "Epilogue";
      
      quizContainer.innerHTML = `
        <div class="glass-panel rounded-lg p-8 text-center space-y-6 fade-in my-auto">
          <div class="w-12 h-12 mx-auto border border-champagne rounded-full flex items-center justify-center">
            <span class="text-champagne font-serif italic text-xl">S</span>
          </div>
          <h2 class="font-serif tracking-widest text-champagne text-lg uppercase">Journey Completed</h2>
          <p class="font-light text-mutedWhite text-sm leading-relaxed">
            埼玉県に隠された数々の秘密。<br>
            その真価を知る者だけが、<br>真のラグジュアリーな体験を手にする。
          </p>
          <div class="pt-6">
            <button onclick="location.reload()" class="w-full py-4 bg-transparent border border-champagne text-champagne hover:bg-champagne hover:text-luxuryBg transition-colors duration-300 rounded font-serif tracking-widest text-sm uppercase">
              Start New Journey
            </button>
          </div>
        </div>
      `;
      nextBtn.classList.add('hidden');
    }

    // 配列シャッフル
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 起動
    initQuiz();
  </script>
</body>
</html>
