<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAITAMANIA | 埼玉探求の書</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif JP"', 'serif'],
            sans: ['"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            paper: '#FAFAF9',
            ink: '#1C1917',
            subtle: '#78716C',
            accent: '#831843',
            accentLight: '#FCE7F3',
            correct: '#065F46', 
            incorrect: '#991B1B' 
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'float': '0 10px 30px -5px rgba(0, 0, 0, 0.08)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAFAF9;
      -webkit-tap-highlight-color: transparent;
      background-image: radial-gradient(#E7E5E4 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .fade-up {
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(16px);
    }
    .fade-up-delay-1 { animation-delay: 0.1s; }
    .fade-up-delay-2 { animation-delay: 0.2s; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .editorial-quote::before {
      content: '“';
      position: absolute;
      top: -10px;
      left: -5px;
      font-size: 4rem;
      color: rgba(131, 24, 67, 0.1);
      font-family: serif;
      line-height: 1;
    }
    .glass-header {
      background: rgba(250, 250, 249, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .option-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .option-card:active:not(:disabled) {
      transform: scale(0.98);
      box-shadow: 0 2px 8px -2px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body class="text-ink font-sans min-h-screen flex flex-col selection:bg-accentLight selection:text-accent relative">

  <!-- ヘッダー（クイズ中のみ表示） -->
  <header id="mainHeader" class="hidden glass-header border-b border-stone-200 px-4 py-4 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <button id="backBtn" class="hidden text-stone-500 hover:text-ink transition-colors p-1" onclick="goBack()" aria-label="前の問題に戻る">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="font-serif tracking-widest text-lg font-bold text-accent flex items-center space-x-2">
        <span>SAITAMANIA</span>
        <span id="modeTag" class="text-[10px] bg-stone-200 text-stone-600 px-2 py-0.5 rounded font-sans font-normal tracking-normal"></span>
      </div>
    </div>
    <div class="text-xs font-medium text-subtle tracking-widest border border-stone-200 rounded-full px-3 py-1 bg-white/50">
      <span id="correctCount" class="text-ink font-bold">0</span> / <span id="totalCount">0</span>
    </div>
  </header>

  <main class="flex-1 max-w-lg w-full mx-auto p-6 flex flex-col justify-center relative">
    
    <!-- ★ 開始画面（Start Screen） -->
    <div id="startScreen" class="flex-1 flex flex-col justify-center items-center text-center fade-up w-full">
      <p class="text-accent font-serif tracking-widest text-sm mb-3">埼玉完全攻略</p>
      <h1 class="text-4xl md:text-5xl font-serif font-bold text-ink tracking-widest mb-10 leading-tight">
        SAITAMANIA<br>
        <span class="text-xl md:text-2xl mt-4 block text-subtle font-medium">埼玉探求の書</span>
      </h1>

      <!-- ローディング表示 -->
      <div id="loadingIndicator" class="animate-pulse text-stone-400 font-serif tracking-widest">
        叡智を読み込んでいます... ✧
      </div>

      <!-- メニュー表示（データ取得後に表示） -->
      <div id="startMenu" class="hidden w-full max-w-xs space-y-6 fade-up">
        
        <!-- モード選択タブ -->
        <div class="bg-stone-200/70 p-1 rounded-xl flex items-center space-x-1 text-xs font-serif font-bold">
          <button id="modeAllBtn" onclick="switchMode('all')" class="flex-1 py-2.5 rounded-lg transition-all bg-white text-ink shadow-soft">
            通常探求
          </button>
          <button id="modeReviewBtn" onclick="switchMode('review')" class="flex-1 py-2.5 rounded-lg transition-all text-subtle hover:text-ink relative">
            復習探求
            <span id="wrongBadge" class="hidden ml-1 px-1.5 py-0.2 bg-accent text-white text-[10px] rounded-full">0</span>
          </button>
        </div>

        <!-- 出題数セレクター（復習モード時は件数に応じて自動調整） -->
        <div id="countSelectorSection">
          <p class="text-xs font-bold text-stone-400 tracking-widest uppercase mb-3">出題数を選択</p>
          <div class="grid grid-cols-2 gap-2.5" id="questionCountSelectors">
            <!-- JSでボタンを動的生成 -->
          </div>
        </div>
        
        <!-- 復習モードで間違えた問題が0件の時のメッセージ -->
        <div id="noWrongNotice" class="hidden p-4 bg-emerald-50 border border-emerald-100 rounded-xl text-xs text-emerald-800 font-serif">
          ✧ 現在、克服すべき苦手な問題はありません。素晴らしい見識です！
        </div>

        <button id="startActionBtn" onclick="startQuiz()" class="w-full py-4 bg-ink text-paper hover:bg-stone-800 transition-colors rounded-xl font-serif tracking-widest shadow-float flex items-center justify-center space-x-2">
          <span>探求を始める</span>
          <span class="text-xl">→</span>
        </button>
      </div>
    </div>

    <!-- ★ クイズ画面（Quiz Screen） -->
    <div id="quizScreen" class="hidden flex-1 flex-col justify-center w-full pb-20">
      <div id="metaTags" class="flex items-center space-x-3 mb-6">
        <span id="cityBadge" class="text-xs font-serif font-bold tracking-widest text-accent border-b border-accent pb-0.5"></span>
        <span class="text-stone-300">|</span>
        <span id="subThemeBadge" class="text-xs text-subtle tracking-wide"></span>
      </div>

      <div class="mb-10">
        <h2 id="questionText" class="font-serif text-2xl md:text-3xl font-semibold leading-relaxed tracking-wide">
          <!-- 問題文 -->
        </h2>
      </div>

      <div id="optionsContainer" class="space-y-4">
        <!-- 選択肢 -->
      </div>

      <div id="explanationArea" class="hidden mt-10 space-y-8">
        <div class="text-center border-b border-stone-200 pb-4">
          <span id="resultIcon" class="text-2xl mr-2"></span>
          <span id="resultText" class="font-serif font-bold text-lg tracking-wide"></span>
        </div>

        <div class="relative editorial-quote pl-6 pr-2">
          <p class="text-xs font-bold text-accent tracking-widest mb-2 uppercase">Dialogue / 語り口</p>
          <p id="mountPhrase" class="font-serif text-lg leading-relaxed text-ink"></p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-soft border border-stone-100">
          <p class="text-xs font-bold text-subtle tracking-widest mb-3 uppercase">Fact / 史実と背景</p>
          <p id="explanationText" class="text-sm leading-relaxed text-stone-700"></p>
        </div>

        <div class="bg-stone-800 text-paper rounded-2xl p-6 shadow-float relative overflow-hidden group">
          <div class="absolute -right-4 -top-4 w-24 h-24 bg-accent/20 rounded-full blur-2xl"></div>
          <p class="text-xs font-bold text-stone-400 tracking-widest mb-2 uppercase relative z-10">Destination / 巡礼地</p>
          <h3 id="spotName" class="font-serif text-xl font-bold mb-4 relative z-10 leading-snug"></h3>
          <button onclick="searchSpot()" class="relative z-10 w-full py-3 bg-paper text-ink hover:bg-stone-200 transition-colors rounded-xl text-sm font-bold tracking-wide flex items-center justify-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>地図で場所を確認する</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="footerAction" class="hidden fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-paper via-paper to-transparent z-40">
    <button id="nextBtn" class="max-w-lg mx-auto w-full py-4 bg-accent hover:bg-accent/90 text-white shadow-float rounded-xl font-serif tracking-widest transition-transform active:scale-95 flex items-center justify-center space-x-2">
      <span>次の探求へ</span>
      <span class="text-xl">→</span>
    </button>
  </div>

  <script>
    // ==============================================================
    // ★ GASのウェブアプリURLをここに貼り付けてください
    // ==============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzgKf5P9EZi9DACFiL9JWqXpFiBE6qDSgA2ATScYz5pALpMIvDYrknPuieU4FMn-0k/exec";

    let ALL_QUIZ_DATA = []; 
    let WRONG_QUIZ_IDS = []; // ローカルストレージから取得する間違えた問題ID
    let currentMode = 'all'; // 'all' (通常) または 'review' (復習)
    let QUIZ_DATABASE = []; 
    let selectedCount = 10; 
    
    let currentIndex = 0;
    let scoreHistory = []; 
    let isAnswered = false;
    let currentSpotName = ""; 

    // DOM Elements
    const startScreen = document.getElementById('startScreen');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const startMenu = document.getElementById('startMenu');
    const modeAllBtn = document.getElementById('modeAllBtn');
    const modeReviewBtn = document.getElementById('modeReviewBtn');
    const wrongBadge = document.getElementById('wrongBadge');
    const countSelectorSection = document.getElementById('countSelectorSection');
    const noWrongNotice = document.getElementById('noWrongNotice');
    const startActionBtn = document.getElementById('startActionBtn');
    const mainHeader = document.getElementById('mainHeader');
    const modeTag = document.getElementById('modeTag');
    const quizScreen = document.getElementById('quizScreen');

    const backBtn = document.getElementById('backBtn');
    const cityBadge = document.getElementById('cityBadge');
    const subThemeBadge = document.getElementById('subThemeBadge');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const explanationArea = document.getElementById('explanationArea');
    const resultIcon = document.getElementById('resultIcon');
    const resultText = document.getElementById('resultText');
    const mountPhrase = document.getElementById('mountPhrase');
    const explanationText = document.getElementById('explanationText');
    const spotName = document.getElementById('spotName');
    const footerAction = document.getElementById('footerAction');
    const nextBtn = document.getElementById('nextBtn');
    const correctCountElem = document.getElementById('correctCount');
    const totalCountElem = document.getElementById('totalCount');

    // ==========================================
    // 1. ローカルストレージ（間違えた問題の永続化）
    // ==========================================
    const STORAGE_KEY = 'saitamania_wrong_quizzes';

    function loadWrongQuizIds() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        WRONG_QUIZ_IDS = data ? JSON.parse(data) : [];
      } catch (e) {
        WRONG_QUIZ_IDS = [];
      }
      updateWrongBadge();
    }

    function addWrongQuizId(id) {
      if (!id) return;
      if (!WRONG_QUIZ_IDS.includes(id)) {
        WRONG_QUIZ_IDS.push(id);
        saveWrongQuizIds();
      }
    }

    function removeWrongQuizId(id) {
      if (!id) return;
      WRONG_QUIZ_IDS = WRONG_QUIZ_IDS.filter(item => item !== id);
      saveWrongQuizIds();
    }

    function saveWrongQuizIds() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(WRONG_QUIZ_IDS));
      } catch (e) {}
      updateWrongBadge();
    }

    function updateWrongBadge() {
      if (WRONG_QUIZ_IDS.length > 0) {
        wrongBadge.textContent = WRONG_QUIZ_IDS.length;
        wrongBadge.classList.remove('hidden');
      } else {
        wrongBadge.classList.add('hidden');
      }
    }

    // ==========================================
    // 2. 初期化とメニュー制御
    // ==========================================
    async function initApp() {
      loadWrongQuizIds();
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data && data.length > 0) {
          ALL_QUIZ_DATA = data;
          loadingIndicator.classList.add('hidden');
          startMenu.classList.remove('hidden');
          renderCountSelectors();
        } else {
          loadingIndicator.textContent = "記録が見つかりません。データベースを確認してください。";
        }
      } catch (error) {
        console.error("API Error:", error);
        loadingIndicator.textContent = "通信の乱れにより、探求の書を開けませんでした。";
      }
    }

    window.switchMode = function(mode) {
      currentMode = mode;
      if (mode === 'all') {
        modeAllBtn.className = "flex-1 py-2.5 rounded-lg transition-all bg-white text-ink shadow-soft";
        modeReviewBtn.className = "flex-1 py-2.5 rounded-lg transition-all text-subtle hover:text-ink relative";
        countSelectorSection.classList.remove('hidden');
        noWrongNotice.classList.add('hidden');
        startActionBtn.disabled = false;
        startActionBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        renderCountSelectors();
      } else {
        modeReviewBtn.className = "flex-1 py-2.5 rounded-lg transition-all bg-white text-accent font-bold shadow-soft relative";
        modeAllBtn.className = "flex-1 py-2.5 rounded-lg transition-all text-subtle hover:text-ink";
        
        // 復習対象のデータ数を計算
        const reviewData = ALL_QUIZ_DATA.filter(q => WRONG_QUIZ_IDS.includes(q.quizId));
        if (reviewData.length === 0) {
          countSelectorSection.classList.add('hidden');
          noWrongNotice.classList.remove('hidden');
          startActionBtn.disabled = true;
          startActionBtn.classList.add('opacity-40', 'cursor-not-allowed');
        } else {
          countSelectorSection.classList.remove('hidden');
          noWrongNotice.classList.add('hidden');
          startActionBtn.disabled = false;
          startActionBtn.classList.remove('opacity-40', 'cursor-not-allowed');
          renderCountSelectors();
        }
      }
    }

    function renderCountSelectors() {
      const container = document.getElementById('questionCountSelectors');
      const targetPool = currentMode === 'all' 
        ? ALL_QUIZ_DATA 
        : ALL_QUIZ_DATA.filter(q => WRONG_QUIZ_IDS.includes(q.quizId));
      
      const maxCount = targetPool.length;
      if (maxCount === 0) return;

      const baseOptions = [5, 10, 20];
      let validOptions = baseOptions.filter(num => num < maxCount);
      validOptions.push(maxCount);

      selectedCount = validOptions.includes(10) ? 10 : validOptions[0];

      container.innerHTML = validOptions.map(opt => `
        <button onclick="selectCount(${opt})" id="countBtn-${opt}" class="count-btn py-3 border border-stone-200 rounded-xl font-serif text-xs text-stone-500 bg-white transition-all ${opt === selectedCount ? 'ring-2 ring-accent border-accent text-accent font-bold bg-accentLight/30' : ''}">
          ${opt === maxCount ? 'すべて (' + maxCount + ')' : opt + ' 問'}
        </button>
      `).join('');
    }

    window.selectCount = function(count) {
      selectedCount = count;
      document.querySelectorAll('.count-btn').forEach(btn => {
        btn.className = "count-btn py-3 border border-stone-200 rounded-xl font-serif text-xs text-stone-500 bg-white transition-all";
      });
      const selectedBtn = document.getElementById(`countBtn-${count}`);
      if (selectedBtn) {
        selectedBtn.classList.add('ring-2', 'ring-accent', 'border-accent', 'text-accent', 'font-bold', 'bg-accentLight/30');
      }
    }

    window.startQuiz = function() {
      const pool = currentMode === 'all' 
        ? ALL_QUIZ_DATA 
        : ALL_QUIZ_DATA.filter(q => WRONG_QUIZ_IDS.includes(q.quizId));

      QUIZ_DATABASE = shuffleArray(pool).slice(0, selectedCount);
      totalCountElem.textContent = QUIZ_DATABASE.length;
      scoreHistory = new Array(QUIZ_DATABASE.length).fill(null);
      
      modeTag.textContent = currentMode === 'all' ? '通常探求' : '復習探求';

      startScreen.classList.add('hidden');
      mainHeader.classList.remove('hidden');
      quizScreen.classList.remove('hidden');
      quizScreen.classList.add('flex');

      loadQuestion(0);
    }

    // ==========================================
    // 3. クイズ出題・正誤判定ロジック
    // ==========================================
    function updateScoreDisplay() {
      const correctScore = scoreHistory.filter(val => val === true).length;
      correctCountElem.textContent = correctScore;
    }

    function loadQuestion(index) {
      isAnswered = false;
      explanationArea.classList.add('hidden');
      footerAction.classList.add('hidden');
      
      if (index === 0) backBtn.classList.add('hidden');
      else backBtn.classList.remove('hidden');

      updateScoreDisplay();

      const metaTags = document.getElementById('metaTags');
      metaTags.classList.remove('fade-up');
      void metaTags.offsetWidth; 
      metaTags.classList.add('fade-up');
      
      questionText.classList.remove('fade-up-delay-1', 'fade-up');
      void questionText.offsetWidth; 
      questionText.classList.add('fade-up', 'fade-up-delay-1');

      const data = QUIZ_DATABASE[index];
      
      cityBadge.textContent = data.city || "埼玉全域";
      subThemeBadge.textContent = data.subTheme || "未分類";
      questionText.innerHTML = `Q${index + 1}.<br>${data.question}`;

      const rawOptions = [
        { text: data.correctAnswer, isCorrect: true },
        { text: data.dummyOption1, isCorrect: false },
        { text: data.dummyOption2, isCorrect: false },
        { text: data.dummyOption3, isCorrect: false }
      ].filter(opt => opt.text); 

      data.shuffledOptions = shuffleArray(rawOptions);

      optionsContainer.innerHTML = '';
      data.shuffledOptions.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = "fade-up fade-up-delay-2 option-card w-full p-5 bg-white border border-stone-100 shadow-soft rounded-2xl text-left font-medium text-stone-700 flex items-center space-x-4";
        btn.dataset.isCorrect = opt.isCorrect;
        btn.innerHTML = `
          <span class="badge w-8 h-8 rounded-full border border-stone-200 flex items-center justify-center text-xs font-serif text-stone-400 shrink-0 bg-stone-50">${String.fromCharCode(65 + i)}</span>
          <span class="leading-relaxed">${opt.text}</span>
        `;
        btn.onclick = () => selectOption(btn, opt.isCorrect, data);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, isCorrect, data) {
      if (isAnswered) return;
      isAnswered = true;

      scoreHistory[currentIndex] = isCorrect;
      updateScoreDisplay();

      // 間違えた問題リストの更新
      if (isCorrect) {
        removeWrongQuizId(data.quizId); // 正解したら克服リストから除外
      } else {
        addWrongQuizId(data.quizId);    // 不正解なら苦手リストに追加
      }

      const buttons = optionsContainer.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.disabled = true;
        const badge = btn.querySelector('.badge');
        
        if (btn.dataset.isCorrect === "true") {
          btn.classList.add('bg-emerald-50', 'border-emerald-200', 'text-correct', 'font-bold', 'opacity-100', 'shadow-md');
          btn.classList.remove('bg-white', 'border-stone-100');
          badge.classList.add('bg-emerald-100', 'border-emerald-300', 'text-emerald-700');
        } else {
          btn.classList.add('opacity-40');
        }
      });

      if (!isCorrect) {
        selectedBtn.classList.remove('opacity-40', 'bg-white', 'border-stone-100');
        selectedBtn.classList.add('bg-red-50', 'border-red-200', 'text-incorrect', 'font-bold', 'opacity-100');
        const badge = selectedBtn.querySelector('.badge');
        badge.classList.add('bg-red-100', 'border-red-300', 'text-red-700');
        
        resultIcon.textContent = "✦";
        resultText.textContent = "不正解";
        resultText.className = "font-serif font-bold text-xl tracking-widest text-incorrect";
      } else {
        resultIcon.textContent = "✧";
        resultText.textContent = "正解";
        resultText.className = "font-serif font-bold text-xl tracking-widest text-correct";
      }

      mountPhrase.textContent = data.mountPhrase;
      explanationText.textContent = data.explanation;
      currentSpotName = data.spot || "埼玉県";
      spotName.textContent = currentSpotName;

      explanationArea.classList.remove('hidden');
      explanationArea.classList.add('fade-up');
      footerAction.classList.remove('hidden');

      setTimeout(() => {
        footerAction.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 100);
    }

    window.goBack = function() {
      if (currentIndex > 0) {
        scoreHistory[currentIndex] = null;
        currentIndex--;
        scoreHistory[currentIndex] = null;
        loadQuestion(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    window.searchSpot = function() {
      const query = encodeURIComponent(currentSpotName);
      window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
    }

    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < QUIZ_DATABASE.length) {
        loadQuestion(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showFinalResult();
      }
    };

    function showFinalResult() {
      const correctScore = scoreHistory.filter(val => val === true).length;
      const rate = Math.round((correctScore / QUIZ_DATABASE.length) * 100);
      
      quizScreen.innerHTML = `
        <div class="fade-up bg-white border border-stone-100 rounded-3xl p-8 text-center shadow-float my-auto w-full">
          <p class="font-serif text-accent tracking-widest text-sm mb-6">探求の記録</p>
          <div class="font-serif text-5xl text-ink mb-3 font-bold">
            ${correctScore} <span class="text-2xl text-stone-300 mx-1">/</span> ${QUIZ_DATABASE.length}
          </div>
          <p class="text-sm font-bold text-stone-500 mb-10 tracking-widest">正答率 ${rate}%</p>
          
          <button onclick="location.reload()" class="w-full py-4 bg-ink text-paper hover:bg-stone-800 rounded-xl font-serif tracking-widest transition-colors shadow-soft">
            書を閉じ、再び探求する
          </button>
        </div>
      `;
      footerAction.classList.add('hidden');
      mainHeader.classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    initApp();
  </script>
